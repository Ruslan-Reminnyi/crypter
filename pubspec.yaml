name: crypter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  rxdart: ^0.28.0

  # UI
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  cupertino_icons: ^2.0.0

  # Navigation
  go_router: ^18.1.4

  # Internationalization and Localization
  intl: ^0.20.3

  # Networking
  dio: ^5.11.1
  connectivity_plus: 7.0.0
  web_socket_channel: ^3.0.3

  # Storage
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  sqflite_common_ffi_web: ^1.2.2

  # Firebase
  firebase_core: 4.15.0
  firebase_analytics: 12.6.0
  firebase_crashlytics: 5.4.0
  firebase_messaging: 16.7.0

  # Forks
  candlesticks:
    path: ./forks/candlesticks

  # Logger
  talker: ^5.1.20
  talker_flutter: ^5.1.4
  talker_dio_logger: ^5.1.4
  talker_riverpod_logger: ^5.1.4

  # Others
  flutter_local_notifications: ^22.3.3
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  generate: true

  uses-material-design: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Bold.ttf
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Light.ttf
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Medium.ttf
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-SemiBold.ttf
